<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Calendar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    .calendar-container {
      width: 100%;
      max-width: 1400px;
      height: calc(100vh - 48px);
      min-height: 600px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .calendar-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .calendar-container {
        height: calc(100vh - 16px);
        min-height: 600px;
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>
  <main class="calendar-container">
    <iframe
      src="https://calendar.google.com/calendar/embed?height=600&amp;wkst=1&amp;bgcolor=%23ffffff&amp;ctz=America%2FLos_Angeles&amp;src=ZGVyb3NlMTIzNEBnbWFpbC5jb20&amp;src=aDU1c2FjZXN2cDQxMGY2cmhmZnE2djRwZWNAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&amp;src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&amp;color=%23E67C73&amp;color=%23D50000&amp;color=%230B8043"
      title="Google Calendar"
      loading="lazy">
    </iframe>
  </main>
</body>
</html>
