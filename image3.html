<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    .gallery {
      width: 100%;
      max-width: 1400px;
      height: calc(100vh - 48px);
      min-height: 600px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .gallery iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>
  <main class="gallery">
    <iframe
      src="https://drive.google.com/embeddedfolderview?id=1lhGUOovW63qZWvXdRDlvM6zOupoIjTb_#grid"
      title="Google Drive image gallery"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
